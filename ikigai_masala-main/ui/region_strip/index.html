<!doctype html>
<meta charset="utf-8">
<!--
  The regional-days strip, as a Streamlit component.

  Streamlit cannot express this: each day is a chip whose colour and border
  state the difference between "picked", "applied" and "applied but below its
  floor", and each opens a menu that groups the regions this day CAN take
  above the ones it cannot, every rejected one carrying its reason. A
  selectbox can hold the options but not the reasons, and it cannot say that a
  region was weighed and rejected rather than forgotten.

  Same static-component rules as `ui/menu_table/index.html`: no npm, no
  bundler, no node in the repo, just the documented postMessage protocol.

  THE IFRAME IS THE HARD PART. A component is an iframe of a fixed height, so
  an absolutely-positioned menu hanging below its chip is CLIPPED — and
  clipped silently, which looks like a dropdown that opens empty. `setHeight`
  below measures the open menu's own bottom edge rather than the document's,
  because an absolute element does not extend `scrollHeight`.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: transparent; }

  .strip { background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 14px;
           box-shadow: 0 1px 3px rgba(19,19,19,0.05); }
  .row   { display: flex; align-items: center; gap: 14px; padding: 12px 16px; }
  .head  { width: 132px; flex-shrink: 0; }
  .head .t { font-size: 13.5px; font-weight: 800; color: #131313; }
  .head .s { font-size: 11.5px; color: #777777; }
  .chips { display: flex; gap: 8px; flex: 1; min-width: 0; }
  .slot  { position: relative; flex: 1; min-width: 0; }

  .chip { display: flex; align-items: center; justify-content: space-between;
          gap: 8px; width: 100%; min-width: 0; padding: 7px 10px 7px 11px;
          border-radius: 10px; text-align: left; cursor: pointer;
          font-family: inherit; background: #FFFFFF; border: 1px solid #D5D5D5; }
  .chip .col { display: flex; flex-direction: column; align-items: flex-start;
               gap: 2px; min-width: 0; }
  .chip .d { font-size: 10.5px; font-weight: 800; letter-spacing: 0.05em;
             text-transform: uppercase; color: #414141; }
  .chip .v { font-size: 12.5px; font-weight: 600; color: #777777;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
             max-width: 100%; }
  /* Four states, four borders. A dashed amber edge means "picked, not applied
     yet" — the one state where the chip and the menu on screen disagree. */
  .chip.applied  { background: #FFF6E3; border: 1px solid #FEBF34; }
  .chip.applied .v { color: #6B4E00; font-weight: 700; }
  .chip.pending  { background: #FFF6E3; border: 1.5px dashed #F0B020; }
  .chip.pending .v { color: #6B4E00; font-weight: 700; }
  .chip.short    { background: #FFF5E8; border: 1px solid #FBC98A; }
  .chip.short .v { color: #A35800; font-weight: 700; }
  .chip.disabled { background: #F9F9F9; border: 1px solid #EFEFEF; cursor: not-allowed; }
  .chip.disabled .d, .chip.disabled .v { color: #AEAEAE; }
  .chip.open { box-shadow: 0 0 0 2px #131313; }
  .chip:focus-visible { outline: 2px solid #0D6EFD; outline-offset: 2px; }
  .chev { flex-shrink: 0; transition: transform .18s ease; }
  .chip.open .chev { transform: rotate(180deg); }

  .menu { position: absolute; top: calc(100% + 6px); width: 280px; z-index: 20;
          background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 12px;
          box-shadow: 0 12px 32px rgba(19,19,19,0.16); overflow: hidden; }
  .menu.left { left: 0; } .menu.right { right: 0; }
  .menu .mh { padding: 11px 12px 9px; border-bottom: 1px solid #F0F0F0; }
  .menu .mh .t { font-size: 12.5px; font-weight: 800; color: #131313; }
  .menu .mh .s { font-size: 11.5px; color: #777777; margin-top: 1px; }
  .menu .body { padding: 6px; display: flex; flex-direction: column; gap: 2px;
                max-height: 292px; overflow-y: auto; }
  .opt { display: flex; align-items: center; justify-content: space-between;
         gap: 10px; width: 100%; padding: 8px 10px; border: none;
         border-radius: 8px; text-align: left; cursor: pointer;
         font-family: inherit; background: transparent; }
  .opt:hover { background: #F9F9F9; }
  .opt.on { background: #FFF6E3; }
  .opt .n { font-size: 13px; font-weight: 600; color: #131313; }
  .opt.on .n { font-weight: 700; color: #6B4E00; }
  .opt .m { font-size: 11.5px; font-weight: 600; color: #777777; }
  .opt .r { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

  /* Rejected regions are SHOWN, greyed, each with its reason. Hidden instead,
     a region reads as forgotten and nobody can tell it was weighed. */
  /* The heading above the off-theme regions. They are pickable like any
     other — the label says what the day's theme will do to them, it does not
     fence them off. */
  .grp { padding: 9px 10px 4px; margin-top: 4px; border-top: 1px solid #F0F0F0;
         font-size: 10.5px; font-weight: 800; color: #777777;
         text-transform: uppercase; letter-spacing: .04em; line-height: 1.35; }
  .opt.off .n { color: #555555; }
  .wrong { padding: 8px 6px 6px; border-top: 1px solid #F0F0F0; }
  .wrong .lbl { font-size: 10.5px; font-weight: 800; color: #777777;
                text-transform: uppercase; letter-spacing: 0.05em;
                padding: 0 6px 4px; }
  .wrong .w { display: flex; align-items: center; justify-content: space-between;
              gap: 10px; width: 100%; padding: 6px 10px; border-radius: 8px; }
  .wrong .w span { font-size: 12.5px; font-weight: 600; color: #AEAEAE; }
  .wrong .w span.m { font-size: 11px; }
  .thin { padding: 8px 12px 11px; border-top: 1px solid #F0F0F0;
          font-size: 11.5px; color: #777777; line-height: 1.45; }
  .thin b { color: #414141; }

  .acts { display: flex; gap: 8px; flex-shrink: 0; }
  .btn  { padding: 8px 14px; border-radius: 8px; font-size: 12.5px;
          font-weight: 700; font-family: inherit;
          background: #FFFFFF; color: #131313; border: 1px solid #E5E5E5;
          cursor: pointer; }
  .btn.primary { background: #FEBF34; border-color: #FEBF34; }
  .btn:disabled { background: #F9F9F9; color: #AEAEAE; border-color: #EFEFEF;
                  cursor: not-allowed; }
  .btn:focus-visible { outline: 2px solid #0D6EFD; outline-offset: 2px; }

  .info { display: flex; align-items: center; gap: 8px; padding: 9px 16px;
          background: #EBF3FF; border-top: 1px solid #D6E6FF;
          border-radius: 0 0 14px 14px; font-size: 12.5px; color: #0A58CA;
          font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<div id="root"></div>
<script>
(function () {
  function post(type, extra) {
    window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, extra || {}), "*");
  }
  function setValue(value) { post("streamlit:setComponentValue", {value: value, dataType: "json"}); }

  var ARGS = null;
  var open = null;          // which day's menu is open; local, no rerun to open one
  var picks = {};
  var SHADOW_PX = 4;        // room for the strip's drop shadow, so it is not clipped

  function setHeight() {
    // An open menu is absolutely positioned, so it does NOT extend
    // `scrollHeight` — measuring the document alone reports the strip's own
    // height and Streamlit clips the menu to it. Take the lower of the two
    // edges instead, plus a little room for the drop shadow.
    //
    // Measure the CONTENT (`#root`), never `document.documentElement`:
    // `scrollHeight` can never report LESS than the iframe's own viewport, so
    // once an open menu has grown the frame the measurement is pinned at the
    // taller value and closing the menu leaves a blank gap exactly the height
    // of the menu that was open. A one-way ratchet — the strip grew when the
    // first region menu opened and never came back down, which on a wide
    // screen reads as a hole between the strip and the rest of the page.
    // `#root` is the only child, so its box IS the content.
    var root = document.getElementById("root");
    var h = root ? root.getBoundingClientRect().height + SHADOW_PX
                 : document.documentElement.scrollHeight;
    var m = document.querySelector(".menu");
    if (m) h = Math.max(h, m.getBoundingClientRect().bottom + window.scrollY + 12);
    post("streamlit:setFrameHeight", {height: Math.ceil(h)});
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c];
    });
  }

  var CHEV = '<svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="#414141" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var TICK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.2 4L19 7" stroke="#6B4E00" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var INFO = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="flex-shrink:0"><circle cx="12" cy="12" r="10" stroke="#0A58CA" stroke-width="2"/><path d="M12 11v6M12 7.5h.01" stroke="#0A58CA" stroke-width="2.4" stroke-linecap="round"/></svg>';

  function state(d) {
    if (d.disabled) return "disabled";
    var picked = picks[d.iso] || "";
    if (picked !== (d.applied || "")) return "pending";
    if (picked && d.below_floor) return "short";
    return picked ? "applied" : "";
  }

  function valueOf(d) {
    if (d.disabled) return "No region";
    var picked = picks[d.iso] || "";
    if (!picked) return (d.applied || picks[d.iso] === "") && d.applied ? "No region" : "Add region";
    return picked + (state(d) === "short" ? " · below floor" : "");
  }

  function render() {
    if (!ARGS) return;
    var days = ARGS.days || [], h = [];
    h.push('<div class="strip"><div class="row">');
    h.push('<div class="head"><div class="t">' + esc((ARGS.header || {}).title || "Regional days") +
           '</div><div class="s">' + esc((ARGS.header || {}).sub || "") + '</div></div>');

    h.push('<div class="chips">');
    days.forEach(function (d, i) {
      var st = state(d);
      h.push('<div class="slot">');
      h.push('<button class="chip ' + st + (open === i ? ' open' : '') + '"' +
             (d.disabled ? ' disabled' : ' data-chip="' + i + '"') +
             ' aria-haspopup="menu" aria-expanded="' + (open === i) + '"' +
             ' title="' + esc(d.title || "") + '">');
      h.push('<span class="col"><span class="d">' + esc(d.chip) + '</span>' +
             '<span class="v">' + esc(valueOf(d)) + '</span></span>');
      if (!d.disabled) h.push(CHEV);
      h.push('</button>');

      if (open === i) {
        // Past the halfway mark the menu opens to the LEFT, or the last day's
        // 280px panel hangs off the right edge of the iframe and is cut.
        var side = i >= Math.ceil(days.length / 2) ? "right" : "left";
        h.push('<div class="menu ' + side + '" role="menu" aria-label="Region for ' + esc(d.long || d.chip) + '">');
        h.push('<div class="mh"><div class="t">' + esc(d.menu_title || "") +
               '</div><div class="s">' + esc(d.menu_sub || "") + '</div></div>');
        h.push('<div class="body">');
        var group = null;
        (d.options || []).forEach(function (o, oi) {
          var on = (picks[d.iso] || "") === (o.value || "");
          // A heading when the group changes, inside the SAME list: every
          // entry stays pickable and `data-opt` keeps one index space.
          if ((o.group || null) !== group) {
            group = o.group || null;
            if (group) h.push('<div class="grp">' + esc(group) + '</div>');
          }
          h.push('<button class="opt' + (on ? ' on' : '') +
                 (o.group ? ' off' : '') + '" role="menuitemradio"' +
                 ' aria-checked="' + on + '" data-opt="' + i + ':' + oi + '">' +
                 '<span class="n">' + esc(o.name) + '</span>' +
                 '<span class="r"><span class="m">' + esc(o.meta || "") + '</span>' +
                 (on ? TICK : "") + '</span></button>');
        });
        h.push('</div>');
        if (d.thin) {
          h.push('<div class="thin"><b>' + esc(d.thin_label || "Too few dishes here:") +
                 '</b> ' + esc(d.thin) + '</div>');
        }
        h.push('</div>');
      }
      h.push('</div>');
    });
    h.push('</div>');

    var a = ARGS.actions || {};
    h.push('<div class="acts">');
    h.push('<button class="btn" data-act="reset"' + (a.reset ? '' : ' disabled') + '>Reset</button>');
    h.push('<button class="btn primary" data-act="apply"' + (a.apply ? '' : ' disabled') + '>' +
           esc(a.apply_label || "Apply") + '</button>');
    h.push('<button class="btn" data-act="save"' + (a.save ? '' : ' disabled') +
           ' title="' + esc(a.save_title || "") + '">' + esc(a.save_label || "Save as weekly default") + '</button>');
    h.push('</div></div>');

    if (ARGS.info) h.push('<div class="info">' + INFO + esc(ARGS.info) + '</div>');
    h.push('</div>');
    document.getElementById("root").innerHTML = h.join("");
    wire();
    setHeight();
  }

  function send(action) { setValue({action: action, picks: picks, nonce: Date.now()}); }

  function wire() {
    document.querySelectorAll("[data-chip]").forEach(function (el) {
      el.onclick = function () {
        var i = +el.getAttribute("data-chip");
        open = (open === i) ? null : i;       // opening a menu is local
        render();
      };
    });
    document.querySelectorAll("[data-opt]").forEach(function (el) {
      el.onclick = function () {
        var p = el.getAttribute("data-opt").split(":");
        var d = ARGS.days[+p[0]], o = d.options[+p[1]];
        if (o.value) picks[d.iso] = o.value; else delete picks[d.iso];
        open = null;
        render();
        send("pick");                          // a pick IS state Python owns
      };
    });
    var m = {reset: "reset", apply: "apply", save: "save"};
    Object.keys(m).forEach(function (k) {
      var el = document.querySelector('[data-act="' + k + '"]');
      if (el && !el.disabled) el.onclick = function () { open = null; render(); send(m[k]); };
    });
  }

  window.addEventListener("message", function (e) {
    if (!e.data || e.data.type !== "streamlit:render") return;
    ARGS = e.data.args || {};
    // Python owns what is picked; the component only owns which menu is open.
    // Re-reading it every render is what keeps a Reset on the server side
    // from leaving a stale pick on screen.
    picks = Object.assign({}, ARGS.picks || {});
    if (ARGS.reset_token !== undefined && ARGS.reset_token !== window.__rtok) {
      window.__rtok = ARGS.reset_token;
      open = null;
    }
    render();
  });

  post("streamlit:componentReady", {apiVersion: 1});
  setHeight();
})();
</script>
